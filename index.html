<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Lavoro</title>
    <!-- Tailwind CSS per una grafica moderna e pulita -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center">Gestione Presenze & Ferie</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Sezione Inserimento -->
        <section class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
            <h2 class="text-lg font-semibold text-slate-700">Registra Giornata</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Data</label>
                <input type="date" id="dataGiorno" class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Stato / Tipo</label>
                <select id="tipoStato" class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none" onchange="gestisciCampi()">
                    <option value="Presente">Presente (Lavorativo)</option>
                    <option value="Ferie">Ferie</option>
                    <option value="Malattia">Malattia</option>
                    <option value="Permesso">Permesso</option>
                    <option value="Straordinario">Straordinario Puro</option>
                </select>
            </div>

            <!-- Campo Ore Straordinario o Permesso -->
            <div id="boxOre" class="hidden">
                <label class="block text-sm font-medium text-slate-600 mb-1">Ore (es. 1.5 o 2)</label>
                <input type="number" step="0.5" id="numOre" placeholder="0" class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Note (Opzionale)</label>
                <input type="text" id="notaGiorno" placeholder="Es. Turno di mattina..." class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button onclick="salvaRegistrazione()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-semibold shadow-lg hover:bg-blue-700 active:scale-95 transition">
                Salva Registrazione
            </button>
        </section>

        <!-- Riepilogo Mensile -->
        <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <h2 class="text-lg font-semibold text-slate-700">Riepilogo Totale</h2>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <span class="block text-blue-600 font-medium">Presenze:</span>
                    <span id="totPresenze" class="text-lg font-bold">0</span>
                </div>
                <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
                    <span class="block text-amber-600 font-medium">Ferie:</span>
                    <span id="totFerie" class="text-lg font-bold">0</span>
                </div>
                <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                    <span class="block text-rose-600 font-medium">Malattia:</span>
                    <span id="totMalattia" class="text-lg font-bold">0</span>
                </div>
                <div class="bg-purple-50 p-3 rounded-xl border border-purple-100">
                    <span class="block text-purple-600 font-medium">Permessi / Straor.:</span>
                    <span id="totOreExtra" class="text-lg font-bold">0h</span>
                </div>
            </div>
        </section>

        <!-- Storico Registrazioni -->
        <section class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-slate-700">Storico</h2>
                <button onclick="cancellaTutto()" class="text-xs text-red-500 font-medium hover:underline">Reset Dati</button>
            </div>
            <div id="listaStorico" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Verrà popolato dinamicamente -->
            </div>
        </section>

    </main>

    <script>
        // Imposta la data odierna come default all'avvio
        document.getElementById('dataGiorno').valueAsDate = new Date();

        function gestisciCampi() {
            const stato = document.getElementById('tipoStato').value;
            const boxOre = document.getElementById('boxOre');
            if (stato === 'Permesso' || stato === 'Straordinario') {
                boxOre.classList.remove('hidden');
            } else {
                boxOre.classList.add('hidden');
            }
        }

        function caricaDati() {
            let registrazioni = JSON.parse(localStorage.getItem('registrazioniLavoro')) || [];
            let lista = document.getElementById('listaStorico');
            lista.innerHTML = '';

            let p = 0, f = 0, m = 0, oreExtra = 0;

            if (registrazioni.length === 0) {
                lista.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">Nessuna registrazione presente.</p>';
            }

            // Ordina per data decrescente
            registrazioni.sort((a, b) => new Date(b.data) - new Date(a.data));

            registrazioni.forEach((reg, index) => {
                // Conteggi
                if (reg.tipo === 'Presente') p++;
                if (reg.tipo === 'Ferie') f++;
                if (reg.tipo === 'Malattia') m++;
                if (reg.tipo === 'Permesso' || reg.tipo === 'Straordinario') {
                    oreExtra += parseFloat(reg.ore || 0);
                }

                // Render elementi lista
                let badgeColor = 'bg-blue-100 text-blue-700';
                if (reg.tipo === 'Ferie') badgeColor = 'bg-amber-100 text-amber-700';
                if (reg.tipo === 'Malattia') badgeColor = 'bg-rose-100 text-rose-700';
                if (reg.tipo === 'Permesso' || reg.tipo === 'Straordinario') badgeColor = 'bg-purple-100 text-purple-700';

                let html = `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                        <div>
                            <span class="font-semibold text-slate-700">${reg.data}</span>
                            <span class="ml-2 px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${reg.tipo} ${reg.ore ? '('+reg.ore+'h)' : ''}</span>
                            ${reg.nota ? '<p class="text-xs text-slate-400 mt-0.5">'+reg.nota+'</p>' : ''}
                        </div>
                        <button onclick="eliminaSingolo(${index})" class="text-slate-400 hover:text-red-500 p-1">✕</button>
                    </div>
                `;
                lista.innerHTML += html;
            });

            document.getElementById('totPresenze').innerText = p;
            document.getElementById('totFerie').innerText = f;
            document.getElementById('totMalattia').innerText = m;
            document.getElementById('totOreExtra').innerText = oreExtra + 'h';
        }

        function salvaRegistrazione() {
            let data = document.getElementById('dataGiorno').value;
            let tipo = document.getElementById('tipoStato').value;
            let ore = document.getElementById('numOre').value;
            let nota = document.getElementById('notaGiorno').value;

            if (!data) {
                alert('Seleziona una data valida.');
                return;
            }

            let registrazioni = JSON.parse(localStorage.getItem('registrazioniLavoro')) || [];
            registrazioni.push({ data, tipo, ore, nota });
            localStorage.setItem('registrazioniLavoro', JSON.stringify(registrazioni));

            // Reset campi secondari
            document.getElementById('numOre').value = '';
            document.getElementById('notaGiorno').value = '';

            caricaDati();
        }

        function eliminaSingolo(index) {
            let registrazioni = JSON.parse(localStorage.getItem('registrazioniLavoro')) || [];
            registrazioni.sort((a, b) => new Date(b.data) - new Date(a.data));
            registrazioni.splice(index, 1);
            localStorage.setItem('registrazioniLavoro', JSON.stringify(registrazioni));
            caricaDati();
        }

        function cancellaTutto() {
            if (confirm('Vuoi davvero cancellare tutto lo storico?')) {
                localStorage.removeItem('registrazioniLavoro');
                caricaDati();
            }
        }

        // Caricamento iniziale all'apertura
        caricaDati();
    </script>
</body>
</html>
